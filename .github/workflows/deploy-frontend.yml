name: Build Cloudflare Worker release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PUBLIC_EVENTS_URL: https://api.eventiapp.com.mx
  PUBLIC_DASHBOARD_URL: ${{ vars.PUBLIC_DASHBOARD_URL || 'https://dashboard.eventiapp.com.mx' }}

jobs:
  # ── Job 1: build + lint check (runs on every push & PR) ──────────────────
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify source revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm

      - name: Validate public build URLs
        run: |
          node --input-type=module <<'NODE'
          for (const name of ["PUBLIC_EVENTS_URL", "PUBLIC_DASHBOARD_URL"]) {
            const value = process.env[name];
            if (!value) throw new Error(`${name} is required`);
            const url = new URL(value);
            if (url.protocol !== "https:") {
              throw new Error(`${name} must use HTTPS`);
            }
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: TypeScript and Astro check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build (static + SSR Functions)
        run: npm run build
        env:
          # Used at build time for OG-tag server-side fetches and client-side API calls.
          PUBLIC_EVENTS_URL: https://api.eventiapp.com.mx

      - name: Verify public bundle budgets
        run: npm run verify:bundle-budget

      - name: Verify Worker artifact contract
        run: npm run verify:worker-artifact

      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 1

