name: Validate public Worker

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PUBLIC_EVENTS_URL: https://api.eventiapp.com.mx
  PUBLIC_DASHBOARD_URL: ${{ vars.PUBLIC_DASHBOARD_URL || 'https://dashboard.eventiapp.com.mx' }}

jobs:
  validate:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify source revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: npm

      - name: Validate public build URLs
        run: |
          node --input-type=module <<'NODE'
          for (const name of ["PUBLIC_EVENTS_URL", "PUBLIC_DASHBOARD_URL"]) {
            const value = process.env[name];
            if (!value) throw new Error(`${name} is required`);
            const url = new URL(value);
            if (url.protocol !== "https:") throw new Error(`${name} must use HTTPS`);
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: TypeScript and Astro check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build immutable Worker artifact
        run: npm run build

      - name: Verify Worker cost and security controls
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const config = JSON.parse(readFileSync('dist/server/wrangler.json', 'utf8'));
          if (config.limits?.cpu_ms !== 10) throw new Error('Worker CPU limit must remain 10 ms');
          if (config.assets?.directory !== '../client') throw new Error('Static assets must remain outside Worker execution');
          if (config.preview_urls !== true) throw new Error('Version preview URLs must be enabled');
          NODE

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: public-worker-${{ github.sha }}
          path: dist/
          retention-days: 1
