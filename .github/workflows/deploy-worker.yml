name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      promote:
        description: Promote the smoke-tested version to 100% traffic
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  PUBLIC_EVENTS_URL: https://api.eventiapp.com.mx
  PUBLIC_DASHBOARD_URL: ${{ vars.PUBLIC_DASHBOARD_URL || 'https://dashboard.eventiapp.com.mx' }}

jobs:
  supersede-queued:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Release older deployments that have not started
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const {owner, repo} = context.repo;
            const {data: current} = await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: context.runId
            });
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: 'deploy-worker.yml', branch: 'main', per_page: 100
            });
            for (const run of runs) {
              if (run.id === context.runId || run.created_at >= current.created_at ||
                  !['queued', 'pending'].includes(run.status)) continue;
              try {
                await github.rest.actions.cancelWorkflowRun({owner, repo, run_id: run.id});
                core.info('Cancelled superseded queued deployment ' + run.id);
              } catch (error) {
                if (error.status !== 409) throw error;
                core.info('Deployment ' + run.id + ' changed state; leaving it alone.');
              }
            }

  candidate:
    needs: supersede-queued
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: eventiapp-public-worker-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm

      - run: npm install --global npm@10.9.9

      - name: Install dependencies
        run: npm ci

      - name: Build immutable Worker artifact
        run: npm run build

      - name: Create and attest release artifact
        run: tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf worker-release.tgz dist

      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: worker-release.tgz

      - name: Upload version without production traffic
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_PRODUCTION_URL: ${{ vars.WORKER_PRODUCTION_URL }}
          VERSION_TAG: release-${{ github.run_id }}-${{ github.run_attempt }}
          PREVIEW_ALIAS: candidate-${{ github.run_id }}
        run: |
          set -euo pipefail
          npx --no-install wrangler versions upload \
            --config dist/server/wrangler.json \
            --strict \
            --keep-vars \
            --tag "${VERSION_TAG}" \
            --message "${GITHUB_REPOSITORY}@${GITHUB_SHA}" \
            --preview-alias "${PREVIEW_ALIAS}" 2>&1 | tee worker-upload.log
          PREVIEW_URL="$(grep -Eo 'https://[a-zA-Z0-9.-]+\.workers\.dev' worker-upload.log | tail -1 || true)"
          if [ -z "${PREVIEW_URL}" ]; then
            test -n "${WORKER_PRODUCTION_URL}"
            PRODUCTION_HOST="${WORKER_PRODUCTION_URL#https://}"
            PRODUCTION_HOST="${PRODUCTION_HOST%%/*}"
            case "${PRODUCTION_HOST}" in
              *.workers.dev) ;;
              *) echo "WORKER_PRODUCTION_URL must use workers.dev to derive the preview URL" >&2; exit 1 ;;
            esac
            PREVIEW_URL="https://${PREVIEW_ALIAS}-${PRODUCTION_HOST}"
          fi
          test -n "${PREVIEW_URL}"
          printf 'preview_url=%s\n' "${PREVIEW_URL}" >> "${GITHUB_OUTPUT}"
          printf 'version_tag=%s\n' "${VERSION_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Smoke candidate
        env:
          CANDIDATE_URL: ${{ steps.upload.outputs.preview_url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 6 --retry-all-errors --retry-delay 5 --max-time 20 \
            "${CANDIDATE_URL%/}/offline/" > /dev/null
          bash scripts/smoke-security-headers.sh "${CANDIDATE_URL}"
          bash scripts/smoke-root.sh "${CANDIDATE_URL}"

      - name: Promote exact tested version
        if: github.event_name == 'push' || inputs.promote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION_TAG: ${{ steps.upload.outputs.version_tag }}
        run: |
          set -euo pipefail
          test -n "${{ vars.WORKER_PRODUCTION_URL }}"
          npx --no-install wrangler versions deploy \
            --config dist/server/wrangler.json \
            --version-tag "${VERSION_TAG}@100%" \
            --message "Promote tested ${GITHUB_SHA}" \
            --yes

      - name: Verify production and roll back on failure
        if: github.event_name == 'push' || inputs.promote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCTION_URL: ${{ vars.WORKER_PRODUCTION_URL }}
        run: |
          set +e
          bash scripts/smoke-security-headers.sh "${PRODUCTION_URL}"
          HEADER_STATUS=$?
          bash scripts/smoke-root.sh "${PRODUCTION_URL}"
          ROOT_STATUS=$?
          if [ "${HEADER_STATUS}" -ne 0 ] || [ "${ROOT_STATUS}" -ne 0 ]; then
            npx --no-install wrangler rollback \
              --config dist/server/wrangler.json \
              --message "Automatic rollback after smoke failure for ${GITHUB_SHA}" \
              --yes
            exit 1
          fi
